sources:
  - name: clmm-v2-insights
    priority: critical
    type: internal-api
    env: CLMM_DATA_API_BASE
    apiKeyEnv: CLMM_INSIGHTS_API_KEY
    endpoint: /insights/sol-usdc/bundle/:walletId
    purpose:
      - full_bundle
      - pool_data
      - positions
      - support_resistance
      - alerts
      - data_quality

  - name: raydium-sol-usdc
    priority: critical
    type: sdk-or-api
    env: RAYDIUM_POOL_ID
    purpose:
      - pool_liquidity
      - current_tick
      - tick_liquidity_distribution
      - fee_apr
      - volume

  - name: pyth-hermes
    priority: high
    type: authenticated-api
    env: PYTH_HERMES_BASE_URL
    apiKeyEnv: PYTH_API_KEY
    feedIdEnv: PYTH_SOL_USD_FEED_ID
    purpose:
      - oracle_price
      - price_sanity_check
    policy:
      timeoutMs: 5000
      maxAttempts: 2
    limitations:
      - Requires active feed subscription or hermes endpoint access.
      - Requires Pyth API key in production environment.

  - name: jupiter-quote
    priority: high
    type: public-api
    env: JUPITER_API_BASE
    apiKeyEnv: JUPITER_API_KEY
    purpose:
      - executable_quote
      - price_sanity_check
    policy:
      timeoutMs: 5000
      maxAttempts: 2
      slippageBps: 50
    limitations:
      - Slippage-sensitive (configured to 50 bps probe).
      - Jupiter API Key is required for high rate-limits in production.
      - Output amount is quote-relative. Freshness is 30 seconds receipt-relative (no wall-clock source timestamp).

  - name: orca-public-api
    priority: high
    type: public-api
    env: ORCA_API_BASE
    poolEnv: ORCA_SOL_USDC_WHIRLPOOL
    endpoint: /public/pool?address=:poolAddress&stats=24h
    purpose:
      - pool_statistics
    policy:
      timeoutMs: 5000
      maxAttempts: 2
    limitations:
      - Unauthenticated and rate-limited behavior on public endpoints.
      - 24-hour rolling statistics window for volume and fees.
      - Dependent on Orca public API availability.

  - name: defillama-solana
    priority: high
    type: public-api
    url: https://api.llama.fi
    purpose:
      - tvl
      - chain_fees
      - dex_volume
      - stablecoin_supply
      - app_revenue

  - name: coingecko-solana
    priority: medium
    type: public-api
    url: https://api.coingecko.com/api/v3
    purpose:
      - market_cap
      - historical_returns
      - broader_market_context

  - name: official-solana-updates
    priority: medium
    type: research-feed
    purpose:
      - network_upgrades
      - outage_or_degradation_risk
      - ecosystem_catalysts
    limitations:
      - Deferred Gap: Solana network-health/status ingestion is identified as a backlog gap after the deterministic vertical slice. It is not part of the core source count and is deferred for future implementation.

  - name: helius-research
    priority: medium
    type: research-feed
    purpose:
      - ecosystem_context
      - infra_context
      - network_activity

  - name: helius-flow
    priority: critical
    type: authenticated-api
    env: HELIUS_FLOW_API_URL
    apiKeyEnv: HELIUS_API_KEY
    purpose:
      - whale_transfer
      - whale_swap
      - stablecoin_flow
      - cex_flow_proxy
    policy:
      timeoutMs: 10000
      maxAttempts: 2
    limitations:
      - Requires Helius API key with flow subscription.
      - Returns realtime transaction-level flow events within the configured lookback window.
      - CEX flow attribution is probabilistic and may be noisy; explicit confidence threshold required.
      - Bounded retention: license must declare "bounded" retention mode.

  - name: birdeye-flow
    priority: critical
    type: authenticated-api
    env: BIRDEYE_FLOW_API_URL
    apiKeyEnv: BIRDEYE_API_KEY
    purpose:
      - dex_net_flow
    policy:
      timeoutMs: 10000
      maxAttempts: 2
    limitations:
      - Requires Birdeye API key with flow data subscription.
      - Returns windowed DEX net flow data (buy/sell volume and net flow).
      - Bounded retention: license must declare "bounded" retention mode.
