sources:
  - name: clmm-v2-insights
    priority: critical
    type: internal-api
    env: CLMM_DATA_API_BASE
    apiKeyEnv: CLMM_INSIGHTS_API_KEY
    endpoint: /insights/sol-usdc/bundle/:walletId
    purpose:
      - full_bundle
      - pool_data
      - positions
      - support_resistance
      - alerts
      - data_quality

  - name: raydium-sol-usdc
    priority: critical
    type: sdk-or-api
    env: RAYDIUM_POOL_ID
    purpose:
      - pool_liquidity
      - current_tick
      - tick_liquidity_distribution
      - fee_apr
      - volume

  - name: pyth-hermes
    priority: high
    type: authenticated-api
    env: PYTH_HERMES_BASE_URL
    apiKeyEnv: PYTH_API_KEY
    feedIdEnv: PYTH_SOL_USD_FEED_ID
    purpose:
      - oracle_price
      - price_sanity_check
    policy:
      timeoutMs: 5000
      maxAttempts: 2
    limitations:
      - Requires active feed subscription or hermes endpoint access.
      - Requires Pyth API key in production environment.

  - name: jupiter-quote
    priority: high
    type: public-api
    env: JUPITER_API_BASE
    apiKeyEnv: JUPITER_API_KEY
    purpose:
      - executable_quote
      - price_sanity_check
    policy:
      timeoutMs: 5000
      maxAttempts: 2
      slippageBps: 50
    limitations:
      - Slippage-sensitive (configured to 50 bps probe).
      - Jupiter API Key is required for high rate-limits in production.
      - Output amount is quote-relative. Freshness is 30 seconds receipt-relative (no wall-clock source timestamp).

  - name: orca-public-api
    priority: high
    type: public-api
    env: ORCA_API_BASE
    poolEnv: ORCA_SOL_USDC_WHIRLPOOL
    endpoint: /pools?addresses=:poolAddress&stats=24h
    purpose:
      - pool_statistics
    policy:
      timeoutMs: 5000
      maxAttempts: 2
    limitations:
      - Unauthenticated and rate-limited behavior on public endpoints.
      - 24-hour rolling statistics window for volume and fees.
      - Dependent on Orca public API availability.

  - name: solana-rpc
    priority: high
    type: authenticated-api
    env: SOLANA_RPC_URL
    apiKeyEnv: SOLANA_RPC_API_KEY
    purpose:
      - network_status
    policy:
      timeoutMs: 5000
      maxAttempts: 2
    limitations:
      - Measures the health and slot of the configured endpoint rather than global consensus.
      - Requires standard JSON-RPC 2.0 endpoint supporting getHealth and getSlot batch calls.

  - name: defillama-solana
    priority: high
    type: public-api
    url: https://api.llama.fi
    purpose:
      - tvl
      - chain_fees
      - dex_volume
      - stablecoin_supply
      - app_revenue

  - name: coingecko-solana
    priority: medium
    type: public-api
    url: https://api.coingecko.com/api/v3
    purpose:
      - market_cap
      - historical_returns
      - broader_market_context

  - name: official-solana-updates
    priority: medium
    type: research-feed
    purpose:
      - network_upgrades
      - outage_or_degradation_risk
      - ecosystem_catalysts
    limitations:
      - Provides human/qualitative context on upgrades and incidents, separate from live deterministic RPC health probes.

  - name: helius-research
    priority: medium
    type: research-feed
    purpose:
      - ecosystem_context
      - infra_context
      - network_activity

  - name: helius-flow
    priority: critical
    type: authenticated-api
    env: HELIUS_FLOW_API_URL
    apiKeyEnv: HELIUS_API_KEY
    purpose:
      - whale_transfer
    policy:
      timeoutMs: 10000
      maxAttempts: 2
    limitations:
      - Uses a legacy address-history endpoint confirmed working on current free-tier key.
      - Endpoint is single-page with limit=100; highly active wallets may exceed this and return incomplete windows.
      - No comprehensive realtime flow subscription; endpoint is polled and returns transaction history.
      - Does NOT supply whale_swap, stablecoin_flow, or CEX proxy attribution on free tier.
      - whale_transfer is scoped to WALLET_PUBLIC_KEY only; comprehensive whale surveillance is out of scope.
      - Bounded retention: license must declare "bounded" retention mode.

  - name: birdeye-flow
    priority: critical
    type: authenticated-api
    env: BIRDEYE_FLOW_API_URL
    apiKeyEnv: BIRDEYE_API_KEY
    purpose:
      - whale_swap
      - dex_net_flow
    policy:
      timeoutMs: 10000
      maxAttempts: 2
    limitations:
      - Requires Birdeye API key with DEX portfolio data access.
      - Returns windowed pair-trade data (buy/sell volume and net flow) for configured pool.
      - whale_swap and dex_net_flow are both live from Birdeye; no Helius overlap on these kinds.
      - Bounded retention: license must declare "bounded" retention mode.
